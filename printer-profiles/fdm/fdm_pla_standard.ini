# FDM PLA Standard Profile
# Printer: Bambu Lab A1, nozzle 0.4mm
# Material: PLA
# Layer height: 0.2mm, Infill: 20%, Supports: auto

printer_technology = FFF
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
extruder_count = 1
gcode_flavor = marlin
use_relative_e_distances = 0

layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
fill_density = 20%
fill_pattern = grid
top_solid_layers = 5
bottom_solid_layers = 4
support_material = 1
support_material_auto = 1
support_material_threshold = 55
support_material_pattern = rectilinear
support_material_spacing = 2.5
support_material_contact_distance = 0.2
support_material_interface_layers = 3

filament_density = 1.24
filament_diameter = 1.75
filament_cost = 0
first_layer_temperature = 215
temperature = 215
first_layer_bed_temperature = 60
bed_temperature = 60
fan_always_on = 1
cooling = 1
min_fan_speed = 35
max_fan_speed = 100

extrusion_width = 0.45
first_layer_extrusion_width = 0.42
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
top_infill_extrusion_width = 0.4

retract_length = 1
retract_speed = 45
travel_speed = 500
perimeter_speed = 300
small_perimeter_speed = 150
external_perimeter_speed = 200
infill_speed = 500
solid_infill_speed = 350
top_solid_infill_speed = 200
support_material_speed = 300
bridge_speed = 100
first_layer_speed = 50
